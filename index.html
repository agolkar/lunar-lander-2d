<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunar Lander</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

/* ============================================================
   CONFIG — every tunable value lives here
   ============================================================ */
const CONFIG = {
  // world / physics
  PX_PER_M: 10,
  GRAVITY: 1.62,          // m/s^2 downward
  THRUST: 4.0,            // m/s^2 along nose
  ROT_RATE_DEG: 90,       // deg/s, attitude set directly
  PHYS_DT: 1 / 120,       // fixed physics timestep

  // fuel
  FUEL_MAX: 100,
  FUEL_BURN: 8,           // units/s while main engine fires
  LOW_FUEL: 20,           // alarm threshold (percent of max)

  // landing limits
  SAFE_VY: 2.0,
  SAFE_VX: 1.5,
  SAFE_TILT_DEG: 8,

  // lander geometry (metres, local coords: +x right, +y down)
  BODY_HALF_W: 1.0,
  BODY_HALF_H: 0.5,
  FOOT_X: 1.1,
  FOOT_Y: 1.2,

  // terrain
  TERRAIN_SEG_MIN: 30,
  TERRAIN_SEG_MAX: 40,
  TERRAIN_TOP_FRAC: 0.65,
  TERRAIN_BOTTOM_FRAC: 1.0,
  PAD_WIDTH: 8.0,         // 4 lander widths
  PAD_MIN_FRAC: 0.15,
  PAD_MAX_FRAC: 0.85,

  // start conditions
  START_Y_FRAC: 0.10,
  START_X_MIN_FRAC: 0.20,
  START_X_MAX_FRAC: 0.80,
  START_VX_MAX: 1.5,

  // crash particles
  PARTICLES_MIN: 20,
  PARTICLES_MAX: 30,
  PARTICLE_LIFE: 2.0,

  // audio
  MASTER_GAIN: 0.5,
  ALARM_FREQ: 880,
  ALARM_LEN: 0.1,
  ALARM_PERIOD: 0.5,

  // visuals
  STAR_COUNT: 70,
  COLOR_LINE: '#d0d0d0',
  COLOR_TERRAIN: '#9a9a9a',
  COLOR_PAD: '#00ff66',
  COLOR_HUD: '#c8c8c8',
  COLOR_OK: '#00ff66',
  COLOR_BAD: '#ff4040',
  COLOR_FLAME: '#ff9c33',
  COLOR_STAR: '#3a3a3a'
};

/* ============================================================
   Canvas / world globals
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let dpr = 1, cssW = 0, cssH = 0;
let worldW = 0, worldH = 0;      // world size in metres
let stars = [];

let terrain = [];                // array of {x,y} in metres, sorted by x
let pad = null;                  // {x0, x1, y} in metres
let lander = null;
let particles = [];
let state = 'READY';             // READY | PLAYING | LANDED | CRASHED
let crashReason = '';
let landingStats = null;

const keys = new Set();

/* ============================================================
   AUDIO — everything synthesised with the Web Audio API
   ============================================================ */
const Sound = (() => {
  let ctxA = null, master = null, engineGain = null, rotGain = null, noiseBuf = null;
  let muted = false, alarmAcc = 0, fuelOutPlayed = false;

  function init() {
    if (ctxA) {
      if (ctxA.state === 'suspended') ctxA.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctxA = new AC();
    master = ctxA.createGain();
    master.gain.value = muted ? 0 : CONFIG.MASTER_GAIN;
    master.connect(ctxA.destination);

    // shared white-noise buffer
    const len = Math.floor(ctxA.sampleRate * 2);
    noiseBuf = ctxA.createBuffer(1, len, ctxA.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    // engine: looped noise -> lowpass 400 Hz -> gain
    const eng = ctxA.createBufferSource();
    eng.buffer = noiseBuf;
    eng.loop = true;
    const lp = ctxA.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 400;
    engineGain = ctxA.createGain();
    engineGain.gain.value = 0;
    eng.connect(lp);
    lp.connect(engineGain);
    engineGain.connect(master);
    eng.start();

    // rotation hiss: looped noise -> highpass -> gain
    const rot = ctxA.createBufferSource();
    rot.buffer = noiseBuf;
    rot.loop = true;
    const hp = ctxA.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2000;
    rotGain = ctxA.createGain();
    rotGain.gain.value = 0;
    rot.connect(hp);
    hp.connect(rotGain);
    rotGain.connect(master);
    rot.start();
  }

  function toggleMute() {
    muted = !muted;
    if (ctxA && master) {
      master.gain.setTargetAtTime(muted ? 0 : CONFIG.MASTER_GAIN, ctxA.currentTime, 0.02);
    }
  }

  function isMuted() { return muted; }

  function beep() {
    if (!ctxA) return;
    const t = ctxA.currentTime;
    const o = ctxA.createOscillator();
    const g = ctxA.createGain();
    o.type = 'square';
    o.frequency.value = CONFIG.ALARM_FREQ;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.01);
    g.gain.linearRampToValueAtTime(0, t + CONFIG.ALARM_LEN);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + CONFIG.ALARM_LEN + 0.02);
  }

  function fuelOutTone() {
    if (!ctxA) return;
    const t = ctxA.currentTime;
    const o = ctxA.createOscillator();
    const g = ctxA.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.5);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + 0.6);
  }

  function landing() {
    if (!ctxA) return;
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((f, i) => {
      const t = ctxA.currentTime + i * 0.13;
      const o = ctxA.createOscillator();
      const g = ctxA.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + 0.32);
    });
  }

  function crash() {
    if (!ctxA) return;
    const t = ctxA.currentTime;
    // noise burst with falling cutoff
    const src = ctxA.createBufferSource();
    src.buffer = noiseBuf;
    const lp = ctxA.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(4000, t);
    lp.frequency.exponentialRampToValueAtTime(120, t + 0.8);
    const g = ctxA.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    src.connect(lp);
    lp.connect(g);
    g.connect(master);
    src.start(t);
    src.stop(t + 0.95);
    // 60 Hz thud
    const o = ctxA.createOscillator();
    const og = ctxA.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(60, t);
    og.gain.setValueAtTime(0.5, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
    o.connect(og);
    og.connect(master);
    o.start(t);
    o.stop(t + 1.05);
  }

  // called once per rendered frame
  function update(dt) {
    if (!ctxA) return;
    const now = ctxA.currentTime;
    const thrusting = state === 'PLAYING' && lander && lander.thrusting && lander.fuel > 0;
    const rotating = state === 'PLAYING' && lander && lander.rotating !== 0;
    engineGain.gain.setTargetAtTime(thrusting ? 0.35 : 0, now, 0.05);
    rotGain.gain.setTargetAtTime(rotating ? 0.06 : 0, now, 0.03);

    if (state === 'PLAYING' && lander && lander.fuel > 0 && lander.fuel <= CONFIG.LOW_FUEL) {
      alarmAcc += dt;
      if (alarmAcc >= CONFIG.ALARM_PERIOD) {
        alarmAcc -= CONFIG.ALARM_PERIOD;
        beep();
      }
    } else {
      alarmAcc = 0;
    }

    if (state === 'PLAYING' && lander && lander.fuel <= 0 && !fuelOutPlayed) {
      fuelOutPlayed = true;
      fuelOutTone();
    }
  }

  // silence all continuous sounds and reset one-shot bookkeeping
  function reset() {
    alarmAcc = 0;
    fuelOutPlayed = false;
    if (!ctxA) return;
    engineGain.gain.setTargetAtTime(0, ctxA.currentTime, 0.02);
    rotGain.gain.setTargetAtTime(0, ctxA.currentTime, 0.02);
  }

  return { init, toggleMute, isMuted, update, reset, landing, crash };
})();

/* ============================================================
   SIZING / STARFIELD
   ============================================================ */
function makeStars() {
  stars = [];
  for (let i = 0; i < CONFIG.STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * cssW,
      y: Math.random() * cssH,
      r: Math.random() < 0.7 ? 1 : 2
    });
  }
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const newW = cssW / CONFIG.PX_PER_M;
  const newH = cssH / CONFIG.PX_PER_M;

  // scale existing terrain (and everything resting on it) to the new size
  if (worldW > 0 && terrain.length) {
    const sx = newW / worldW;
    const sy = newH / worldH;
    for (const v of terrain) { v.x *= sx; v.y *= sy; }
    if (pad) { pad.x0 *= sx; pad.x1 *= sx; pad.y *= sy; }
    if (lander) { lander.x *= sx; lander.y *= sy; }
    for (const p of particles) { p.x *= sx; p.y *= sy; }
  }
  worldW = newW;
  worldH = newH;
  makeStars();
}

/* ============================================================
   TERRAIN — generation, pad carving, height lookup
   ============================================================ */
function terrainHeightAtVerts(verts, x) {
  if (x <= verts[0].x) return verts[0].y;
  for (let i = 1; i < verts.length; i++) {
    if (x <= verts[i].x) {
      const a = verts[i - 1], b = verts[i];
      const dx = b.x - a.x;
      const t = dx > 0 ? (x - a.x) / dx : 0;
      return a.y + (b.y - a.y) * t;
    }
  }
  return verts[verts.length - 1].y;
}

function terrainHeightAt(x) {
  if (!terrain.length) return worldH;
  if (x <= terrain[0].x) return terrain[0].y;
  for (let i = 1; i < terrain.length; i++) {
    if (x <= terrain[i].x) {
      const a = terrain[i - 1], b = terrain[i];
      const dx = b.x - a.x;
      const t = dx > 0 ? (x - a.x) / dx : 0;
      return a.y + (b.y - a.y) * t;
    }
  }
  return terrain[terrain.length - 1].y;
}

function generateTerrain() {
  const W = worldW, H = worldH;
  const segs = CONFIG.TERRAIN_SEG_MIN +
    Math.floor(Math.random() * (CONFIG.TERRAIN_SEG_MAX - CONFIG.TERRAIN_SEG_MIN + 1));

  // jagged polyline across the full width, in the lower 35% of the screen
  const verts = [];
  for (let i = 0; i <= segs; i++) {
    verts.push({
      x: (i / segs) * W,
      y: H * (CONFIG.TERRAIN_TOP_FRAC +
        Math.random() * (CONFIG.TERRAIN_BOTTOM_FRAC - CONFIG.TERRAIN_TOP_FRAC))
    });
  }

  // carve exactly one flat pad, 4 lander widths wide
  const padW = CONFIG.PAD_WIDTH;
  const center = W * (CONFIG.PAD_MIN_FRAC +
    Math.random() * (CONFIG.PAD_MAX_FRAC - CONFIG.PAD_MIN_FRAC));
  let padX0 = center - padW / 2;
  padX0 = Math.max(0, Math.min(W - padW, padX0));
  const padX1 = padX0 + padW;
  const padY = terrainHeightAtVerts(verts, (padX0 + padX1) / 2);

  const out = [];
  for (const v of verts) if (v.x < padX0) out.push(v);
  out.push({ x: padX0, y: padY });
  out.push({ x: padX1, y: padY });
  for (const v of verts) if (v.x > padX1) out.push(v);

  terrain = out;
  pad = { x0: padX0, x1: padX1, y: padY };
}

/* ============================================================
   LANDER — reset, geometry helpers
   ============================================================ */
function resetLander() {
  lander = {
    x: worldW * (CONFIG.START_X_MIN_FRAC +
      Math.random() * (CONFIG.START_X_MAX_FRAC - CONFIG.START_X_MIN_FRAC)),
    y: worldH * CONFIG.START_Y_FRAC,
    vx: (Math.random() * 2 - 1) * CONFIG.START_VX_MAX,
    vy: 0,
    angle: 0,                 // radians, 0 = upright, positive = clockwise
    fuel: CONFIG.FUEL_MAX,
    thrusting: false,
    rotating: 0
  };
}

function wrapX(x) {
  x %= worldW;
  if (x < 0) x += worldW;
  return x;
}

function footpadPositions() {
  const c = Math.cos(lander.angle), s = Math.sin(lander.angle);
  const fx = CONFIG.FOOT_X, fy = CONFIG.FOOT_Y;
  return [
    { x: lander.x - fx * c - fy * s, y: lander.y - fx * s + fy * c },
    { x: lander.x + fx * c - fy * s, y: lander.y + fx * s + fy * c }
  ];
}

function getCollisionPoints() {
  const c = Math.cos(lander.angle), s = Math.sin(lander.angle);
  const pts = [];
  const add = (lx, ly) => pts.push({
    x: lander.x + lx * c - ly * s,
    y: lander.y + lx * s + ly * c
  });
  const bw = CONFIG.BODY_HALF_W, bh = CONFIG.BODY_HALF_H;
  add(-bw, -bh);
  add(bw, -bh);
  add(bw, bh);
  add(-bw, bh);
  add(-CONFIG.FOOT_X, CONFIG.FOOT_Y);
  add(CONFIG.FOOT_X, CONFIG.FOOT_Y);
  return pts;
}

/* ============================================================
   PHYSICS — semi-implicit Euler at a fixed timestep
   ============================================================ */
function stepPhysics(dt) {
  // rotation sets attitude directly (no angular momentum)
  const rotInput = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
  lander.angle += rotInput * (CONFIG.ROT_RATE_DEG * Math.PI / 180) * dt;
  lander.rotating = rotInput;

  // main engine
  let thrusting = false;
  if (keys.has('ArrowUp') && lander.fuel > 0) {
    thrusting = true;
    lander.fuel = Math.max(0, lander.fuel - CONFIG.FUEL_BURN * dt);
  }
  lander.thrusting = thrusting;

  // accelerations (metres / second^2)
  let ax = 0;
  let ay = CONFIG.GRAVITY;
  if (thrusting) {
    ax += CONFIG.THRUST * Math.sin(lander.angle);
    ay += -CONFIG.THRUST * Math.cos(lander.angle);
  }

  // v += a*dt, then p += v*dt
  lander.vx += ax * dt;
  lander.vy += ay * dt;
  lander.x += lander.vx * dt;
  lander.y += lander.vy * dt;

  // horizontal wrap, no ceiling
  if (lander.x < 0) lander.x += worldW;
  else if (lander.x >= worldW) lander.x -= worldW;

  checkCollision();
}

/* ============================================================
   COLLISION — footpads + body corners vs terrain
   ============================================================ */
function checkCollision() {
  const pts = getCollisionPoints();
  let hit = false;
  for (const p of pts) {
    if (p.y >= terrainHeightAt(wrapX(p.x))) { hit = true; break; }
  }
  if (!hit) return;

  const pads = footpadPositions();
  const inPad = pads.every(p => {
    const x = wrapX(p.x);
    return x >= pad.x0 && x <= pad.x1;
  });
  const tiltDeg = Math.abs(normalizeDeg(lander.angle * 180 / Math.PI));
  const speedOk = Math.abs(lander.vy) <= CONFIG.SAFE_VY &&
                  Math.abs(lander.vx) <= CONFIG.SAFE_VX;

  if (inPad && speedOk && tiltDeg <= CONFIG.SAFE_TILT_DEG) {
    // success: record stats, snap onto pad, stop
    landingStats = {
      vy: Math.abs(lander.vy),
      tilt: tiltDeg,
      fuel: lander.fuel
    };
    lander.angle = 0;
    lander.vx = 0;
    lander.vy = 0;
    lander.thrusting = false;
    lander.rotating = 0;
    lander.y = pad.y - CONFIG.FOOT_Y;
    state = 'LANDED';
    Sound.landing();
    return;
  }

  // crash — report the first failing reason
  let reason = 'MISSED THE PAD';
  if (inPad) reason = !speedOk ? 'TOO FAST' : 'TOO TILTED';
  crashReason = reason;
  state = 'CRASHED';
  spawnParticles();
  Sound.crash();
}

/* ============================================================
   CRASH PARTICLES
   ============================================================ */
function spawnParticles() {
  const n = CONFIG.PARTICLES_MIN +
    Math.floor(Math.random() * (CONFIG.PARTICLES_MAX - CONFIG.PARTICLES_MIN + 1));
  particles = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    particles.push({
      x: lander.x,
      y: lander.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1,
      angle: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 8,
      len: 0.3 + Math.random() * 0.7,
      life: CONFIG.PARTICLE_LIFE
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += CONFIG.GRAVITY * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.angle += p.va * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function normalizeDeg(d) {
  d %= 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

function altitude() {
  const pads = footpadPositions();
  const lowest = Math.max(pads[0].y, pads[1].y);
  const ground = terrainHeightAt(wrapX(lander.x));
  return Math.max(0, ground - lowest);
}

function fuelColor(f) {
  if (f > 25) return CONFIG.COLOR_OK;
  if (f > 10) return '#ffb000';
  return CONFIG.COLOR_BAD;
}

/* ============================================================
   RENDERING
   ============================================================ */
function drawStars() {
  ctx.fillStyle = CONFIG.COLOR_STAR;
  for (const s of stars) ctx.fillRect(s.x, s.y, s.r, s.r);
}

function drawTerrain() {
  const PX = CONFIG.PX_PER_M;

  ctx.strokeStyle = CONFIG.COLOR_TERRAIN;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < terrain.length; i++) {
    const v = terrain[i];
    if (i === 0) ctx.moveTo(v.x * PX, v.y * PX);
    else ctx.lineTo(v.x * PX, v.y * PX);
  }
  ctx.stroke();

  // landing pad in bright green, thicker line
  ctx.strokeStyle = CONFIG.COLOR_PAD;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(pad.x0 * PX, pad.y * PX);
  ctx.lineTo(pad.x1 * PX, pad.y * PX);
  ctx.stroke();

  // marker lights at both ends
  ctx.fillStyle = CONFIG.COLOR_PAD;
  ctx.beginPath(); ctx.arc(pad.x0 * PX, pad.y * PX, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(pad.x1 * PX, pad.y * PX, 3, 0, Math.PI * 2); ctx.fill();
}

function drawLander() {
  const PX = CONFIG.PX_PER_M;
  const c = Math.cos(lander.angle), s = Math.sin(lander.angle);
  const W = (lx, ly) => [
    (lander.x + lx * c - ly * s) * PX,
    (lander.y + lx * s + ly * c) * PX
  ];

  ctx.strokeStyle = CONFIG.COLOR_LINE;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const bw = CONFIG.BODY_HALF_W, bh = CONFIG.BODY_HALF_H;
  const fx = CONFIG.FOOT_X, fy = CONFIG.FOOT_Y;

  // body
  ctx.beginPath();
  let p = W(-bw, -bh); ctx.moveTo(p[0], p[1]);
  p = W(bw, -bh); ctx.lineTo(p[0], p[1]);
  p = W(bw, bh); ctx.lineTo(p[0], p[1]);
  p = W(-bw, bh); ctx.lineTo(p[0], p[1]);
  ctx.closePath();
  ctx.stroke();

  // legs with footpads
  ctx.beginPath();
  p = W(-0.7, 0.1); ctx.moveTo(p[0], p[1]);
  p = W(-fx, fy); ctx.lineTo(p[0], p[1]);
  p = W(-fx - 0.15, fy); ctx.moveTo(p[0], p[1]);
  p = W(-fx + 0.15, fy); ctx.lineTo(p[0], p[1]);
  p = W(0.7, 0.1); ctx.moveTo(p[0], p[1]);
  p = W(fx, fy); ctx.lineTo(p[0], p[1]);
  p = W(fx - 0.15, fy); ctx.moveTo(p[0], p[1]);
  p = W(fx + 0.15, fy); ctx.lineTo(p[0], p[1]);
  ctx.stroke();

  // engine nozzle
  ctx.beginPath();
  p = W(-0.35, bh); ctx.moveTo(p[0], p[1]);
  p = W(0.35, bh); ctx.lineTo(p[0], p[1]);
  p = W(0.25, bh + 0.35); ctx.lineTo(p[0], p[1]);
  p = W(-0.25, bh + 0.35); ctx.lineTo(p[0], p[1]);
  ctx.closePath();
  ctx.stroke();

  // exhaust flame (only while the engine actually fires)
  if (lander.thrusting && lander.fuel > 0) {
    const fl = 0.6 + Math.random() * 0.5;
    ctx.strokeStyle = CONFIG.COLOR_FLAME;
    ctx.beginPath();
    p = W(-0.28, bh + 0.35); ctx.moveTo(p[0], p[1]);
    p = W(0, bh + 0.35 + fl); ctx.lineTo(p[0], p[1]);
    p = W(0.28, bh + 0.35); ctx.lineTo(p[0], p[1]);
    ctx.stroke();

    ctx.strokeStyle = '#ffe0a0';
    ctx.beginPath();
    p = W(-0.12, bh + 0.35); ctx.moveTo(p[0], p[1]);
    p = W(0, bh + 0.35 + fl * 0.6); ctx.lineTo(p[0], p[1]);
    p = W(0.12, bh + 0.35); ctx.lineTo(p[0], p[1]);
    ctx.stroke();
  }
}

function drawParticles() {
  const PX = CONFIG.PX_PER_M;
  ctx.lineWidth = 2;
  for (const p of particles) {
    const a = Math.max(0, p.life / CONFIG.PARTICLE_LIFE);
    ctx.strokeStyle = 'rgba(255,180,90,' + a.toFixed(3) + ')';
    const dx = Math.cos(p.angle) * p.len * 0.5;
    const dy = Math.sin(p.angle) * p.len * 0.5;
    ctx.beginPath();
    ctx.moveTo((p.x - dx) * PX, (p.y - dy) * PX);
    ctx.lineTo((p.x + dx) * PX, (p.y + dy) * PX);
    ctx.stroke();
  }
}

/* ============================================================
   HEADS-UP DISPLAY
   ============================================================ */
function drawHUD() {
  const x0 = 16, y0 = 22, lh = 20;
  ctx.font = '14px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  const alt = altitude();
  const vx = lander.vx, vy = lander.vy;
  const rotDeg = normalizeDeg(lander.angle * 180 / Math.PI);

  ctx.fillStyle = CONFIG.COLOR_HUD;
  ctx.fillText('ALTITUDE: ' + alt.toFixed(1) + ' m', x0, y0);

  ctx.fillStyle = Math.abs(vx) <= CONFIG.SAFE_VX ? CONFIG.COLOR_OK : CONFIG.COLOR_BAD;
  ctx.fillText('HORIZ SPEED: ' + Math.abs(vx).toFixed(2) + ' m/s ' +
    (vx < 0 ? '\u2190' : '\u2192'), x0, y0 + lh);

  ctx.fillStyle = Math.abs(vy) <= CONFIG.SAFE_VY ? CONFIG.COLOR_OK : CONFIG.COLOR_BAD;
  ctx.fillText('VERT SPEED: ' + Math.abs(vy).toFixed(2) + ' m/s ' +
    (vy < 0 ? '\u2191' : '\u2193'), x0, y0 + 2 * lh);

  ctx.fillStyle = Math.abs(rotDeg) <= CONFIG.SAFE_TILT_DEG ? CONFIG.COLOR_OK : CONFIG.COLOR_BAD;
  ctx.fillText('ROTATION: ' + rotDeg.toFixed(1) + '\u00b0', x0, y0 + 3 * lh);

  // fuel number + bar gauge
  const f = lander.fuel;
  ctx.fillStyle = f <= 0 ? CONFIG.COLOR_BAD : CONFIG.COLOR_HUD;
  ctx.fillText(f <= 0 ? 'FUEL: EMPTY' : 'FUEL: ' + Math.round(f), x0, y0 + 4 * lh);

  const bx = x0 + 90, by = y0 + 4 * lh + 5, bw = 120, bh = 10;
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  const fw = Math.max(0, Math.min(1, f / CONFIG.FUEL_MAX)) * (bw - 2);
  ctx.fillStyle = fuelColor(f);
  ctx.fillRect(bx + 1, by + 1, fw, bh - 2);

  ctx.fillStyle = '#666';
  ctx.fillText('M: mute' + (Sound.isMuted() ? ' (muted)' : ''), x0, y0 + 5 * lh + 6);
}

/* ============================================================
   CENTRED STATE MESSAGES
   ============================================================ */
function drawMessages() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = cssW / 2, cy = cssH / 2;

  if (state === 'READY') {
    ctx.font = '20px monospace';
    ctx.fillStyle = CONFIG.COLOR_HUD;
    ctx.fillText('Press any arrow key to start', cx, cy);
  } else if (state === 'LANDED' && landingStats) {
    ctx.font = '28px monospace';
    ctx.fillStyle = CONFIG.COLOR_OK;
    ctx.fillText('LANDED SAFELY', cx, cy - 50);
    ctx.font = '16px monospace';
    ctx.fillStyle = CONFIG.COLOR_HUD;
    ctx.fillText('Touchdown vertical speed: ' + landingStats.vy.toFixed(2) + ' m/s', cx, cy);
    ctx.fillText('Tilt: ' + landingStats.tilt.toFixed(1) + '\u00b0', cx, cy + 26);
    ctx.fillText('Fuel remaining: ' + landingStats.fuel.toFixed(1), cx, cy + 52);
    ctx.fillText('Press R to restart', cx, cy + 100);
  } else if (state === 'CRASHED') {
    ctx.font = '28px monospace';
    ctx.fillStyle = CONFIG.COLOR_BAD;
    ctx.fillText('CRASHED: ' + crashReason, cx, cy - 30);
    ctx.font = '16px monospace';
    ctx.fillStyle = CONFIG.COLOR_HUD;
    ctx.fillText('Press R to restart', cx, cy + 30);
  }
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cssW, cssH);

  drawStars();
  drawTerrain();
  if (state === 'PLAYING' || state === 'READY') drawLander();
  drawParticles();
  drawHUD();
  drawMessages();
}

/* ============================================================
   GAME LOOP — fixed physics timestep with accumulator
   ============================================================ */
function step(dt) {
  if (state === 'PLAYING') stepPhysics(dt);
  updateParticles(dt);
}

let lastT = 0, acc = 0;

function frame(t) {
  if (lastT === 0) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;

  acc += dt;
  let guard = 0;
  while (acc >= CONFIG.PHYS_DT && guard < 1000) {
    step(CONFIG.PHYS_DT);
    acc -= CONFIG.PHYS_DT;
    guard++;
  }

  Sound.update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   RESTART
   ============================================================ */
function restart() {
  generateTerrain();
  resetLander();
  particles = [];
  crashReason = '';
  landingStats = null;
  state = 'READY';
  Sound.reset();
}

/* ============================================================
   INPUT
   ============================================================ */
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k.startsWith('Arrow')) e.preventDefault();
  Sound.init();

  if (k === 'r' || k === 'R') { restart(); return; }
  if (k === 'm' || k === 'M') { Sound.toggleMute(); return; }

  if (k.startsWith('Arrow')) {
    keys.add(k);
    if (state === 'READY') state = 'PLAYING';
  }
});

window.addEventListener('keyup', (e) => {
  keys.delete(e.key);
});

window.addEventListener('blur', () => {
  keys.clear();
});

window.addEventListener('resize', resize);

/* ============================================================
   BOOT
   ============================================================ */
resize();
generateTerrain();
resetLander();
state = 'READY';
requestAnimationFrame(frame);
</script>
</body>
</html>
